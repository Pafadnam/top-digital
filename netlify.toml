# TOP Digital — configuration Netlify (site statique, aucune dépendance)
[build]
  publish = "."
  # Remplace __SITE_URL__ par l'adresse réelle du site (domaine Netlify ou domaine personnalisé)
  command = "sed -i \"s#__SITE_URL__#${URL}#g\" index.html robots.txt sitemap.xml"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/audio/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/og-image.jpg"
  [headers.values]
    Cache-Control = "public, max-age=604800"
